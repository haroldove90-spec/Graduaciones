<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#142C54"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background circular badge with subtle rim -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  
  <!-- Outer laurel wreath leaves -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M120 370 C90 320 90 220 150 160 C165 145 185 135 210 130" />
    <path d="M392 370 C422 320 422 220 362 160 C347 145 327 135 302 130" />
    <!-- Left Leaves -->
    <path d="M102 330 C120 325 130 310 126 295 C115 305 105 315 102 330 Z" fill="url(#goldGrad)" />
    <path d="M96 270 C114 262 122 245 116 230 C107 242 98 255 96 270 Z" fill="url(#goldGrad)" />
    <path d="M112 210 C130 198 134 180 125 167 C118 181 112 195 112 210 Z" fill="url(#goldGrad)" />
    <path d="M148 160 C165 145 165 125 152 115 C148 132 145 145 148 160 Z" fill="url(#goldGrad)" />
    <!-- Right Leaves -->
    <path d="M410 330 C392 325 382 310 386 295 C397 305 407 315 410 330 Z" fill="url(#goldGrad)" />
    <path d="M416 270 C398 262 390 245 396 230 C405 242 414 255 416 270 Z" fill="url(#goldGrad)" />
    <path d="M400 210 C382 198 378 180 387 167 C394 181 400 195 400 210 Z" fill="url(#goldGrad)" />
    <path d="M364 160 C347 145 347 125 360 115 C364 132 367 145 364 160 Z" fill="url(#goldGrad)" />
  </g>
  
  <!-- Graduation Cap (Mortarboard) -->
  <g transform="translate(0, -10)">
    <!-- Cap Diamond / Rhombus -->
    <path d="M256 160 L410 220 L256 280 L102 220 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <path d="M256 172 L388 220 L256 268 L124 220 Z" fill="#0F2042" opacity="0.95"/>
    
    <!-- Skullcap below -->
    <path d="M168 250 L168 290 C168 325 208 345 256 345 C304 345 344 325 344 290 L344 250 C322 265 290 274 256 274 C222 274 190 265 168 250 Z" fill="url(#goldGrad)"/>
    
    <!-- Tassel Button & String -->
    <circle cx="256" cy="220" r="9" fill="url(#goldLight)"/>
    <path d="M256 220 Q330 230 360 275 L360 330" fill="none" stroke="url(#goldLight)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Tassel Fringe -->
    <polygon points="352,330 368,330 374,375 346,375" fill="url(#goldGrad)"/>
    <circle cx="360" cy="330" r="6" fill="url(#goldLight)"/>
  </g>

  <!-- Diploma Scroll at Bottom -->
  <g transform="translate(186, 370)">
    <rect x="0" y="0" width="140" height="28" rx="8" fill="#FFFBEB" stroke="url(#goldGrad)" stroke-width="3"/>
    <rect x="60" y="-3" width="20" height="34" rx="3" fill="url(#goldGrad)"/>
    <path d="M70 31 L64 45 L70 41 L76 45 Z" fill="#B45309"/>
  </g>

  <!-- 3 Stars above cap -->
  <g fill="url(#goldLight)">
    <polygon points="256,90 261,102 274,103 264,111 267,124 256,117 245,124 248,111 238,103 251,102" />
    <polygon points="212,106 215,114 224,115 217,121 219,130 212,125 205,130 207,121 200,115 209,114" opacity="0.8" />
    <polygon points="300,106 303,114 312,115 305,121 307,130 300,125 293,130 295,121 288,115 297,114" opacity="0.8" />
  </g>
</svg>
